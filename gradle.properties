org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# CPU features baked into the native build. See README "Performance tuning".
#   armv8.2-a+dotprod            -> works on nearly all 2019+ phones (default, safe)
#   armv8.6-a+i8mm+dotprod       -> Pixel 8+/Snapdragon 8 Gen 1+ (faster prefill, SIGILL on older CPUs)
cpuArch=armv8.2-a+dotprod
